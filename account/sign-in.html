<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Wholesale Clearance UK</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="container page-main auth-page">
    <a href="../joblots.html" class="logo auth-logo">Wholesale Clearance UK</a>
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="auth-note" id="auth-mode-note">Loading…</p>
      <form id="sign-in-form" class="auth-form">
        <label>Email <input type="email" name="email" required autocomplete="email"></label>
        <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
      <p class="auth-links"><a href="forgot-password.html">Forgot password?</a> · <a href="register.html">Create account</a></p>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
    </div>
  </main>
  <script type="module">
    import { signIn, getAuthModeLabel } from '../js/account.js';
    document.getElementById('auth-mode-note').textContent = getAuthModeLabel();
    document.getElementById('sign-in-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errEl = document.getElementById('auth-error');
      errEl.hidden = true;
      try {
        await signIn(fd.get('email'), fd.get('password'));
        const ret = new URLSearchParams(location.search).get('return') || '../account/index.html';
        location.href = ret;
      } catch (err) {
        errEl.hidden = false;
        errEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
