<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password | Wholesale Clearance UK</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="container page-main auth-page">
    <div class="auth-card">
      <h1>Forgot password</h1>
      <form id="reset-form" class="auth-form">
        <label>Email <input type="email" name="email" required></label>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
      <p class="auth-links"><a href="sign-in.html">Back to sign in</a></p>
      <p id="reset-msg" class="auth-success" hidden role="status"></p>
    </div>
  </main>
  <script type="module">
    import { requestPasswordReset } from '../js/account.js';
    document.getElementById('reset-form').addEventListener('submit', (e) => {
      e.preventDefault();
      try {
        const msg = requestPasswordReset(new FormData(e.target).get('email'));
        const el = document.getElementById('reset-msg');
        el.hidden = false; el.textContent = msg.message;
      } catch (err) { alert(err.message); }
    });
  </script>
</body>
</html>
